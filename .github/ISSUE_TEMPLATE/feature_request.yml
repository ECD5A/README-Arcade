name: Feature request
description: Propose a focused mode, configuration, accessibility, or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Existing render mode
        - New render mode
        - Configuration
        - GitHub Actions
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior and, for visual changes, the intended light and dark appearance.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This request is focused on one feature.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
