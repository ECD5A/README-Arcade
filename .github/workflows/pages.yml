name: deploy gallery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "preview/**"
      - "dist/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static gallery
        shell: bash
        run: |
          mkdir -p _site
          cp -R dist _site/dist
          sed 's#\.\./dist/#./dist/#g' preview/index.html > _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
