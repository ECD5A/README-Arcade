name: render README Arcade

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      user:
        description: "Optional GitHub login override"
        required: false
        type: string
      seed:
        description: "Optional animation route seed"
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

concurrency:
  group: readme-arcade-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render SVG
        uses: ./
        with:
          user: ${{ github.event.inputs.user }}
          seed: ${{ github.event.inputs.seed }}
          config: readme-arcade.config.json
          output-dir: dist

      - name: Render gallery
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          README_ARCADE_USER: ${{ github.event.inputs.user }}
          REQUESTED_SEED: ${{ github.event.inputs.seed }}
        run: |
          if [ -n "$REQUESTED_SEED" ]; then
            export README_ARCADE_SEED="$REQUESTED_SEED"
          else
            export README_ARCADE_SEED="$(date -u +%F)"
          fi
          python scripts/render_gallery.py

      - name: Commit generated SVG
        run: |
          if git diff --quiet -- dist; then
            echo "No generated changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Update README Arcade SVG"
          git push
