name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test all render modes
        shell: bash
        run: |
          for mode in lifegrid snake matrix defrag; do
            python scripts/render.py \
              --config readme-arcade.config.json \
              --mode "$mode" \
              --base-name "$mode" \
              --out-dir ".test-dist/$mode"
          done
